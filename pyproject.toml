[project]
name = "cardiac-calculator"
version = "0.1.0"
description = "An MVP for a simple calculator app with cardiac-obstetric applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4",
    "dash-bootstrap-components>=2.0",
    "gunicorn>=26.2",
    "more-itertools>=11.2",
    "pandas>=3.0",
]

[dependency-groups]
dev = [
    "black>=26.10",
    "ipykernel>=7.4",
    "ipytest>=0.14",
    "pylint>=4.1",
    "pytest-clarity>=1.0",
]

[tool.uv]
package = false
